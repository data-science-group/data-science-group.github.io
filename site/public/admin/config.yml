# DSRL Site Admin — Decap CMS configuration (locked decision D2 + governance
# design). STAGING-FIRST: this config targets the staging repo until the
# founder-led production cutover; the backend block is swapped then.
#
# UX conventions (founder feedback 2026-07-05): new list entries appear at the
# TOP; internal ids are hidden (auto-derived from names at build); photos are
# uploaded directly in the form; person groups/degrees are free text, never
# hard-coded menus; links are optional.

backend:
  name: github
  repo: data-science-group/data-science-group.github.io
  branch: master
  # OAuth proxy: founder-owned Cloudflare Worker (deployed 2026-07-05).
  base_url: https://dsrl-admin-auth.amin-beheshti.workers.dev
  squash_merges: true

# Local testing: `npx decap-server` in the repo root + astro dev, then open
# /admin/. Writes go to the local filesystem — no GitHub involved.
local_backend: true

publish_mode: editorial_workflow
media_folder: site/public/uploads
public_folder: /uploads

site_url: https://data-science-group.github.io
display_url: https://data-science-group.github.io

collections:
  - name: around-cards
    label: "Home — Around the Lab cards"
    description: "The cards on the main page. Drag to reorder — the order here is the display order. New cards are added at the top."
    files:
      - name: cards
        label: "Around the Lab"
        file: site/src/data/around-cards.yml
        fields:
          - name: cards
            label: Cards
            label_singular: card
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - name: image
                label: Photo
                widget: image
                media_folder: /img/aroundthelab
                public_folder: img/aroundthelab
                hint: "Upload here — the image lands with the card automatically"
              - { name: link, label: Link, widget: string, hint: "Where the card goes: a page like BioFM/2026/ or a full https:// URL" }
              - { name: badge, label: Badge, widget: string, required: false, hint: "Optional label like 'Upcoming' — leave empty for none" }
              - { name: external, label: Opens in new tab, widget: boolean, default: false, required: false }
              - { name: visible, label: Show on the page, widget: boolean, default: true }
              - { name: assignee, label: Responsible person, widget: string, required: false }
              - { name: id, widget: hidden, required: false }

  - name: people-data
    label: "People"
    description: "Current members and alumni. New entries appear at the top of the list."
    files:
      - name: people
        label: "Current members"
        file: site/src/data/people.yml
        fields:
          - name: people
            label: Members
            label_singular: member
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: Full name, widget: string, hint: "e.g. Dr. Jane Citizen" }
              - { name: role, label: Role, widget: string, hint: "Anything — PhD Student, MRes Y2 + PhD, Research Intern, Visiting Professor…" }
              - name: photo
                label: Photo
                widget: image
                required: false
                media_folder: /img/people
                public_folder: img/people
                hint: "Upload the member's photo here (square headshots look best)"
              - name: group
                label: Grouping (optional)
                widget: string
                required: false
                hint: "Only used to group people on the page — e.g. academics, phd, mres. Leave empty and it follows the role."
              - name: links
                label: Links (all optional)
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: linkedin, label: LinkedIn, widget: string, required: false }
                  - { name: scholar, label: Google Scholar, widget: string, required: false }
                  - { name: orcid, label: ORCID, widget: string, required: false }
                  - { name: website, label: Website, widget: string, required: false }
              - { name: id, widget: hidden, required: false }
      - name: alumni
        label: "Alumni"
        file: site/src/data/alumni.yml
        fields:
          - name: alumni
            label: Alumni
            label_singular: alumnus
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}} ({{fields.graduated}})"
            fields:
              - { name: name, label: Full name, widget: string }
              - { name: degree, label: Degree / role, widget: string, hint: "Anything — PhD Student, MRes, Postdoctoral Research Fellow…" }
              - { name: graduated, label: Year finished, widget: number, value_type: int }
              - { name: thesis, label: Thesis / project title, widget: text, required: false }
              - { name: supervisors, label: Supervisors, widget: list, required: false, hint: "One name per item" }
              - { name: destination, label: Where they went (optional), widget: string, required: false, hint: "e.g. Google · Assistant Professor, UNSW — only if verified" }
              - { name: award, label: Awards (optional), widget: text, required: false }
              - { name: link, label: LinkedIn or website (optional), widget: string, required: false }
              - { name: id, widget: hidden, required: false }

  - name: conferences
    label: "Target conferences"
    description: "Deadline tracker data. New entries appear at the top."
    files:
      - name: conferences
        label: "Conference list"
        file: site/src/data/conferences.yml
        fields:
          - { name: maintainer, label: Maintainer, widget: string }
          - { name: source, label: Original source URL, widget: string }
          - { name: updatedAt, label: Last updated, widget: string, hint: "YYYY-MM-DD" }
          - name: conferences
            label: Conferences
            label_singular: conference
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string, hint: "e.g. ICML 2027 – International Conference on Machine Learning" }
              - { name: url, label: Website, widget: string }
              - { name: paperDeadline, label: Paper deadline, widget: string, required: false, hint: "e.g. Jan 28, 2027" }
              - { name: startDate, label: Event start date, widget: string, required: false, hint: "YYYY-MM-DD" }
              - { name: location, label: Location, widget: string, required: false }
              - name: topic
                label: Topic
                widget: select
                options: ["Machine Learning", "Computer Vision", "Health Informatics", "NLP", "Data Mining & IR", "Web & Networks", "Security", "Software Engineering", "Robotics", "Cloud Computing"]
              - { name: rank, label: CORE rank (optional), widget: select, options: ["A*", "A", "B", "C"], required: false }
              - { name: notificationDate, label: Notification (optional), widget: string, required: false }
              - { name: cameraReady, label: Camera-ready (optional), widget: string, required: false }
              - { name: visible, label: Show in the tracker, widget: boolean, default: true }

  - name: news
    label: "News"
    description: "Lab news, tech news and manual reposts of the lab's own LinkedIn posts."
    folder: site/src/content/news
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{title}} ({{date | date('DD MMM YYYY')}})"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: teaser, label: Teaser, widget: text, hint: "One or two sentences shown in lists (max 280 characters)", pattern: ['^[\s\S]{1,280}$', "Must be 1-280 characters"] }
      - name: kind
        label: Kind
        widget: select
        options: ["lab-news", "tech-news", "linkedin-mirror", "event", "award", "publication", "keynote"]
        default: "lab-news"
      - name: program
        label: Program
        widget: select
        options: ["dsrl", "bds", "aipa", "aiple", "biofm"]
        default: "dsrl"
      - { name: featured, label: "Show on the main page", widget: boolean, default: false, required: false, hint: "Featured entries replace the automatic upcoming selection on the home page" }
      - { name: badge, label: "Main-page badge (optional)", widget: string, required: false, hint: "e.g. Upcoming, New, Award — red badge shown next to the type on the home page" }
      - { name: author, label: Author (optional), widget: string, required: false }
      - { name: tags, label: Tags (optional), widget: list, required: false, max: 5 }
      - name: cover
        label: Cover image (optional)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: image, label: Image, widget: image }
          - { name: alt, label: What the image shows (required with an image), widget: string }
      - name: source
        label: Source attribution (optional)
        widget: object
        required: false
        collapsed: true
        hint: "For manual reposts of the lab's own LinkedIn posts — never scraped content"
        fields:
          - { name: label, label: Label, widget: string, default: "LinkedIn post", required: false }
          - { name: url, label: URL, widget: string, required: false }
          - { name: canonical, label: Canonical source, widget: boolean, default: false, required: false }
      - { name: body, label: Body (optional), widget: markdown, required: false }

  - name: workshops
    label: "Workshops & events"
    description: "The event records that drive workshop listings."
    folder: site/src/content/workshops
    create: true
    extension: yml
    format: yml
    slug: "{{slug}}"
    summary: "{{edition}} ({{status}})"
    fields:
      - { name: edition, label: Edition, widget: string, hint: "e.g. BioFM'26" }
      - { name: title, label: Full title, widget: string }
      - { name: series, label: Series, widget: string, hint: "AIPA / AIPLE / BioFM / BDS Hackathon — or a new one" }
      - { name: year, label: Year, widget: number, value_type: int }
      - { name: status, label: Status, widget: select, options: ["upcoming", "past"] }
      - { name: dates, label: Dates as shown, widget: string, hint: "e.g. 12–15 November 2026" }
      - { name: url, label: Page URL, widget: string, hint: "e.g. BioFM/2026/ or a full https:// URL" }
      - { name: venue, label: Venue (optional), widget: string, required: false }
      - { name: colocated, label: Co-located with (optional), widget: string, required: false }
      - { name: chairs, label: Chairs (optional), widget: list, required: false }
      - { name: sponsors, label: Sponsors (optional), widget: list, required: false }
      - { name: startDate, label: Start date (optional), widget: string, required: false, hint: "YYYY-MM-DD" }
      - { name: endDate, label: End date (optional), widget: string, required: false }
      - { name: timezone, label: Timezone, widget: string, default: "Australia/Sydney", required: false }
      - { name: cfpDeadline, label: CFP deadline (optional), widget: string, required: false }
      - { name: proceedings, label: Proceedings URL (optional), widget: string, required: false }

  - name: pages
    label: "Pages"
    description: "Standalone site pages — founder-only (the ownership guard blocks everyone else by default). After publishing, a page appears at /<filename>/ — e.g. lab-history becomes /lab-history/. Use lowercase letters, digits and dashes in the filename; names already used by the site (publications, contact, BioFM…) are rejected at build."
    folder: site/src/content/pages
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string, hint: "The page heading, e.g. Lab History" }
      - { name: description, label: Description, widget: string, hint: "One sentence for search engines", pattern: ['^[\s\S]{1,200}$', "Must be 1-200 characters"] }
      - { name: body, label: Body, widget: markdown }
